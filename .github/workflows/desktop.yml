name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SDL_UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
      SDL_GITEE_UPDATE_BASE_URL: ${{ vars.SDL_GITEE_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run build:electron

      # better-sqlite3 必须按 Electron ABI 重建；CI 镜像自带编译链
      - run: npx electron-rebuild -f -w better-sqlite3

      - run: npx electron-builder --publish never

      # 打包后必须真的能启动：在 Windows 上启动未打包版，验证自动建库 + 本地服务
      - name: Smoke packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/win-unpacked/*.exe |
            Where-Object { $_.Name -notlike 'Uninstall*' } |
            Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30

          Write-Host "process alive: $(-not $process.HasExited) exit: $($process.ExitCode)"
          $bootLog = Join-Path $env:TEMP 'sdl-desktop.log'
          if (Test-Path $bootLog) {
            Write-Host '--- boot log ---'
            Get-Content $bootLog
          } else {
            Write-Host '--- no boot log ---'
          }

          $vault = Get-ChildItem "$env:APPDATA" -Recurse -Depth 4 -Filter '.sdl-vault' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $vault) {
            Get-ChildItem "$env:APPDATA" -Directory | Select-Object Name
            throw "启动后没有创建数据目录（.sdl-vault）"
          }
          Write-Host "vault: $($vault.FullName)"

          $ports = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.OwningProcess -eq $process.Id }
          if (-not $ports) {
            throw "启动后没有监听本地端口"
          }
          foreach ($port in ($ports.LocalPort | Select-Object -Unique)) {
            $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/healthz"
            Write-Host "healthz on ${port}: $($response.StatusCode)"
            if ($response.StatusCode -ne 200) { throw "healthz 非 200" }
          }

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          mkdir -p docs/releases
          if [ ! -f "docs/releases/${{ github.ref_name }}.md" ]; then
            printf '发布说明见 CHANGELOG。\n' > "docs/releases/${{ github.ref_name }}.md"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: docs/releases/${{ github.ref_name }}.md
